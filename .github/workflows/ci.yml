name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read # nx-set-shas reads previous workflow runs

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every main commit gets its own result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main:
    name: Format, lint, test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # nx affected needs history to find the base commit
          filter: tree:0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - run: pnpm exec prettier --check .
      - run: pnpm nx sync:check
      - run: pnpm nx affected -t lint test typecheck build --output-style=static

      # The committed API description must match the code (no server or database needed)
      - name: Check that openapi.json is up to date
        run: |
          pnpm nx run catalog:openapi --output-style=static
          git diff --exit-code -- apps/services/catalog/openapi.json
        env:
          DATABASE_URL: postgresql://unused@localhost:5432/catalog

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # nx affected needs history to find the base commit
          filter: tree:0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      # Testcontainers starts throwaway Postgres containers on the runner's Docker
      - run: pnpm nx affected -t integration --output-style=static
