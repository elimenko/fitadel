packages:
  - 'apps/*'
  - 'apps/*/*'
  - 'libs/*/*'
  - 'tools/*'
allowBuilds:
  '@swc/core': true
  nx: true
  '@parcel/watcher': false
  unrs-resolver: false
  '@nestjs/core': false
  # Downloads the schema engine binary used by prisma migrate
  '@prisma/engines': true
  # preinstall only checks the Node.js version
  prisma: false
  # Testcontainers' Docker client (SSH transport): optional native addons, pure-JS fallbacks
  cpu-features: false
  ssh2: false
  # postinstall only prints a version-scheme warning
  protobufjs: false
  # Install analytics (via swagger-ui-dist); no function for us
  '@scarf/scarf': false
