# Local development infrastructure: docker compose up -d
name: fitadel

services:
  postgres:
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitadel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-fitadel}
      # Service roles, created by tools/db/*.sh
      CATALOG_MIGRATOR_PASSWORD: ${CATALOG_MIGRATOR_PASSWORD:?Set CATALOG_MIGRATOR_PASSWORD in .env (see .env.example)}
      CATALOG_APP_PASSWORD: ${CATALOG_APP_PASSWORD:?Set CATALOG_APP_PASSWORD in .env (see .env.example)}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker
      - postgres-data:/var/lib/postgresql
      # Runs *.sh on first start with an empty volume only (*.psql files are ignored)
      - ./tools/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Development-only observability backend in one container: OpenTelemetry Collector,
  # Prometheus (metrics), Loki (logs), Tempo (traces) and Grafana. Services send OTLP to it.
  lgtm:
    image: grafana/otel-lgtm:0.38.1@sha256:0df9bc14142000b161344bd24caf6ddd319b7319055aedaf9b0692b125730af7
    environment:
      # Local only (ports bound to 127.0.0.1): skip the Grafana login
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    ports:
      - '127.0.0.1:3001:3000' # Grafana UI (3000 is the catalog service)
      - '127.0.0.1:4317:4317' # OTLP gRPC
      - '127.0.0.1:4318:4318' # OTLP HTTP
    volumes:
      - lgtm-data:/data
      - ./tools/observability/grafana-datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro

volumes:
  postgres-data:
  lgtm-data:
