# Local development infrastructure: docker compose up -d
name: fitadel

services:
  postgres:
    image: postgres:18.6-trixie@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitadel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-fitadel}
      # Service roles, created by tools/db/*.sh
      CATALOG_MIGRATOR_PASSWORD: ${CATALOG_MIGRATOR_PASSWORD:?Set CATALOG_MIGRATOR_PASSWORD in .env (see .env.example)}
      CATALOG_APP_PASSWORD: ${CATALOG_APP_PASSWORD:?Set CATALOG_APP_PASSWORD in .env (see .env.example)}
      CATALOG_READER_PASSWORD: ${CATALOG_READER_PASSWORD:?Set CATALOG_READER_PASSWORD in .env (see .env.example)}
      IDENTITY_MIGRATOR_PASSWORD: ${IDENTITY_MIGRATOR_PASSWORD:?Set IDENTITY_MIGRATOR_PASSWORD in .env (see .env.example)}
      IDENTITY_APP_PASSWORD: ${IDENTITY_APP_PASSWORD:?Set IDENTITY_APP_PASSWORD in .env (see .env.example)}
      IDENTITY_READER_PASSWORD: ${IDENTITY_READER_PASSWORD:?Set IDENTITY_READER_PASSWORD in .env (see .env.example)}
      DIARY_MIGRATOR_PASSWORD: ${DIARY_MIGRATOR_PASSWORD:?Set DIARY_MIGRATOR_PASSWORD in .env (see .env.example)}
      DIARY_APP_PASSWORD: ${DIARY_APP_PASSWORD:?Set DIARY_APP_PASSWORD in .env (see .env.example)}
      DIARY_READER_PASSWORD: ${DIARY_READER_PASSWORD:?Set DIARY_READER_PASSWORD in .env (see .env.example)}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker
      - postgres-data:/var/lib/postgresql
      # Runs *.sh on first start with an empty volume only (*.psql files are ignored)
      - ./tools/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Development-only observability backend in one container: OpenTelemetry Collector,
  # Prometheus (metrics), Loki (logs), Tempo (traces) and Grafana. Services send OTLP to it.
  lgtm:
    image: grafana/otel-lgtm:0.38.1@sha256:0df9bc14142000b161344bd24caf6ddd319b7319055aedaf9b0692b125730af7
    environment:
      # Local only (ports bound to 127.0.0.1): skip the Grafana login
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    ports:
      - '127.0.0.1:3001:3000' # Grafana UI (3000 is the catalog service)
      - '127.0.0.1:4317:4317' # OTLP gRPC
      - '127.0.0.1:4318:4318' # OTLP HTTP
    volumes:
      - lgtm-data:/data
      - ./tools/observability/grafana-datasources.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/grafana-datasources.yaml:ro

  # Message broker for events between services (ADR-0012): one node in KRaft mode, the
  # broker and its controller in one process (no ZooKeeper). Two listeners, because a
  # client connects to the address the broker advertises: services on the host use
  # localhost:9092, containers (kafka-init) use kafka:19092.
  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    environment:
      CLUSTER_ID: NOc973IaFVrMXiJnIeN8Lw # any 16 bytes, base64url; fixed so the volume keeps working
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # One broker: internal topics can't have more than one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are created on purpose (kafka-init), never by a typo in a client
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      # A new consumer group starts at once instead of waiting for more members
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - '127.0.0.1:9092:9092'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null',
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  # Creates the topics once Kafka is healthy, then exits; already existing ones are kept.
  # Partitions spread the keys; one consumer still reads all of them.
  kafka-init:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    command:
      [
        '/opt/kafka/bin/kafka-topics.sh',
        '--bootstrap-server',
        'kafka:19092',
        '--create',
        '--if-not-exists',
        '--topic',
        'diary.food-logged',
        '--partitions',
        '3',
        '--replication-factor',
        '1',
      ]

  # Development-only mail server: catches every email the services send (nothing is
  # delivered) and shows it in a web inbox. The services send over plain SMTP to :1025.
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # Web inbox and API
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # Development-only API gateway (ADR-0009): one origin in front of the services, which
  # run on the host (nx serve), reached through host.docker.internal.
  gateway:
    image: envoyproxy/envoy:v1.40.0@sha256:459f2a6404c340fe6afccd69d85527012d47f3c036765493e6f8f3113fa384de
    command: ['-c', '/etc/envoy/envoy.yaml']
    extra_hosts:
      - 'host.docker.internal:host-gateway' # Docker Desktop has it; Linux (CI) needs this
    ports:
      - '127.0.0.1:8080:8080' # Public entry point
      - '127.0.0.1:9901:9901' # Admin: stats, config dump (never expose beyond loopback)
    volumes:
      - ./tools/gateway/envoy.yaml:/etc/envoy/envoy.yaml:ro

volumes:
  postgres-data:
  lgtm-data:
  kafka-data:
